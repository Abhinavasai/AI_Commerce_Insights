# SQLite-only local stack — no Postgres/Neo4j/LocalStack required.
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    environment:
      RUNTIME_MODE: local
      DATABASE_URL: sqlite+aiosqlite:////data/commerce.db
      LOCAL_STORAGE_PATH: /storage/uploads
      AI_PIPELINE_URL: http://ai-pipeline:8001
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: local-dev-secret
    ports:
      - "8100:8000"
    volumes:
      - ./data:/data
      - ./storage/uploads:/storage/uploads

  ai-pipeline:
    build:
      context: .
      dockerfile: services/ai-pipeline/Dockerfile
    environment:
      RUNTIME_MODE: local
      DATABASE_URL: sqlite+aiosqlite:////data/commerce.db
      LOCAL_STORAGE_PATH: /storage/uploads
      JWT_SECRET: local-dev-secret
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./storage/uploads:/storage/uploads
