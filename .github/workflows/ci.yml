name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ./shared
          python -m pip install fastapi "uvicorn[standard]" httpx email-validator sse-starlette python-multipart
      - name: Mode + imports
        env:
          RUNTIME_MODE: local
        run: |
          export PYTHONPATH=shared
          python -c "from shared.runtime import resolve_runtime_mode; assert resolve_runtime_mode()=='local'"
          PYTHONPATH=shared:services/core-api python -c "from app.main import app; print('core-api', app.title)"
          PYTHONPATH=shared:services/ai-pipeline python -c "from app.main import app; print('ai-pipeline', app.title)"
      - name: Seed + health script syntax
        env:
          RUNTIME_MODE: local
          PYTHONPATH: shared
        run: |
          python scripts/seed_db.py
          python -m py_compile scripts/test_e2e.py scripts/create_superuser.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100
