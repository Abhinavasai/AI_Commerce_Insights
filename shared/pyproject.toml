[project]
name = "commerceai-shared"
version = "0.1.0"
description = "Shared models and dual-mode adapters for AI Commerce Insights"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "boto3>=1.34",
  "neo4j>=5.17",
  "structlog>=24.1",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "openai>=1.30",
  "tiktoken>=0.7",
  "python-multipart>=0.0.9",
  "greenlet>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
